aws.region=ap-south-1
aws.s3.bucket-name=fraud-forensic-logs-elizabeth
aws.s3.presign.expiry-minutes=15

# OpenSearch Serverless — endpoint without trailing slash
aws.opensearch.endpoint=https://awml64dmmgwshvlrq18b.aoss.ap-south-1.on.aws
aws.opensearch.index=fraud-forensics-vector-db
# Maximum hits returned per search request (bounded to prevent oversized payloads)
aws.opensearch.max-results=20

spring.application.name=fraud-forensic-service
server.port=8080

# Java 21 virtual threads — mounts Tomcat and @Async pools onto virtual threads
spring.threads.virtual.enabled=true

# Never expose stack traces or internal details in error responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

logging.level.com.ibm.forensic=INFO
